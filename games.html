<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playground — Daniel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#231942; --bg-2:#2f1f57; --paper:#FFF6E9; --sun:#FFC857; --coral:#FF6B6B; --mint:#4ECDC4;
    --ink:#1A1425; --cream-text:#F4F1FA; --dim:#B7AFD1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:radial-gradient(circle at 15% 10%, var(--bg-2), transparent 40%),
               radial-gradient(circle at 85% 90%, var(--bg-2), transparent 45%), var(--bg);
    color:var(--cream-text); font-family:'Inter', sans-serif;
  }
  a{color:inherit;}
  ::selection{background:var(--coral); color:var(--ink);}

  .wrap{max-width:640px; margin:0 auto; padding:36px 22px 80px;}
  header{display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;}
  .logo{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:1.2rem;}
  .logo span{color:var(--sun);}
  .back{
    font-family:'JetBrains Mono', monospace; font-size:0.85rem; text-decoration:none;
    color:var(--dim); border-bottom:1px solid transparent;
  }
  .back:hover{color:var(--sun); border-color:var(--sun);}

  .field-label{
    font-family:'JetBrains Mono', monospace; font-size:0.78rem; letter-spacing:0.06em;
    text-transform:uppercase; color:var(--sun); display:block; margin-bottom:14px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif; font-weight:700;
    font-size:clamp(2rem, 5vw, 2.8rem); margin:0 0 14px; letter-spacing:-0.02em;
  }
  h1 .hl{color:var(--coral);}
  .lead{color:#D9D3EC; line-height:1.65; max-width:480px; margin-bottom:32px;}

  .game-panel{
    background:#2A1D4E; border-radius:16px; border:1px solid rgba(244,241,250,0.08);
    padding:24px; box-shadow:0 20px 50px rgba(0,0,0,0.35);
  }
  .hud{
    display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;
    font-family:'JetBrains Mono', monospace; font-size:0.88rem;
  }
  .hud .score{color:var(--sun);}
  .hud .best{color:var(--mint);}

  #gameCanvas{
    display:block; width:100%; aspect-ratio:1/1; background:#1A1130;
    border-radius:10px; border:1px solid rgba(244,241,250,0.08); touch-action:none;
  }

  .controls-row{
    display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:12px; flex-wrap:wrap;
  }
  .hint{font-family:'JetBrains Mono', monospace; font-size:0.78rem; color:var(--dim);}
  .btn{
    font-family:'JetBrains Mono', monospace; font-size:0.85rem;
    padding:11px 20px; border-radius:8px; text-decoration:none; font-weight:500;
    background:var(--sun); color:var(--ink); border:none; cursor:pointer;
    transition:transform .15s ease;
  }
  .btn:hover{transform:translateY(-2px);}

  /* mobile d-pad */
  .dpad{display:none; margin-top:20px; justify-content:center;}
  .dpad-grid{
    display:grid; grid-template-columns:repeat(3, 54px); grid-template-rows:repeat(3, 54px); gap:6px;
  }
  .dpad button{
    background:rgba(244,241,250,0.08); border:1px solid rgba(244,241,250,0.15);
    color:var(--cream-text); border-radius:8px; font-size:1.1rem; cursor:pointer;
  }
  .dpad-up{grid-column:2; grid-row:1;}
  .dpad-left{grid-column:1; grid-row:2;}
  .dpad-right{grid-column:3; grid-row:2;}
  .dpad-down{grid-column:2; grid-row:3;}

  .overlay-msg{
    text-align:center; font-family:'JetBrains Mono', monospace; font-size:0.9rem;
    color:var(--coral); margin-top:14px; min-height:20px;
  }

  footer{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;
    font-family:'JetBrains Mono', monospace; font-size:0.8rem; color:var(--dim);
    border-top:1px solid rgba(244,241,250,0.1); padding-top:26px; margin-top:50px;
  }
  footer a{text-decoration:none; color:var(--sun);}

  @media(max-width:560px){
    .dpad{display:flex;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">daniel<span>.</span>dev</div>
    <a href="index.html" class="back">← Balik ke portfolio</a>
  </header>

  <span class="field-label">Playground</span>
  <h1>Rehat sekejap, main <span class="hl">Snake.</span></h1>
  <p class="lead">Bila dah penat scroll portfolio, boleh main game ni jap. Guna arrow key (atau d-pad kat mobile) untuk kawal.</p>

  <div class="game-panel">
    <div class="hud">
      <span class="score">Skor: <span id="score">0</span></span>
      <span class="best">Terbaik: <span id="best">0</span></span>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="controls-row">
      <span class="hint">↑ ↓ ← → untuk gerak</span>
      <button class="btn" id="restartBtn">Restart</button>
    </div>
    <div class="overlay-msg" id="overlayMsg"></div>

    <div class="dpad">
      <div class="dpad-grid">
        <button class="dpad-up" data-dir="up">↑</button>
        <button class="dpad-left" data-dir="left">←</button>
        <button class="dpad-right" data-dir="right">→</button>
        <button class="dpad-down" data-dir="down">↓</button>
      </div>
    </div>
  </div>

  <footer>
    <span>&copy; 2026 Daniel</span>
    <a href="index.html">← Balik ke portfolio</a>
  </footer>
</div>

<script>
(function(){
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlayMsg = document.getElementById('overlayMsg');
  const restartBtn = document.getElementById('restartBtn');

  const GRID = 20;
  let cellSize = canvas.width / GRID;

  const colors = { snakeHead:'#FFC857', snakeBody:'#4ECDC4', food:'#FF6B6B', grid:'rgba(244,241,250,0.04)' };

  // Custom head image — upload a file named exactly "snake-head.png" in the same folder as this page
  const headImg = new Image();
  let headImgLoaded = false;
  headImg.onload = () => { headImgLoaded = true; };
  headImg.onerror = () => { headImgLoaded = false; }; // falls back to colored square if missing
  headImg.src = 'snake-head.png';

  let snake, dir, nextDir, food, score, best, running, loopId;
  let bestScore = 0;

  function reset(){
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    running = true;
    overlayMsg.textContent = '';
    placeFood();
    updateHud();
  }

  function placeFood(){
    let valid = false;
    while(!valid){
      food = { x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID) };
      valid = !snake.some(s => s.x === food.x && s.y === food.y);
    }
  }

  function updateHud(){
    scoreEl.textContent = score;
    bestEl.textContent = bestScore;
  }

  function tick(){
    if(!running) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // wall collision
    if(head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID){
      return gameOver();
    }
    // self collision
    if(snake.some(s => s.x === head.x && s.y === head.y)){
      return gameOver();
    }

    snake.unshift(head);

    if(head.x === food.x && head.y === food.y){
      score += 10;
      if(score > bestScore) bestScore = score;
      updateHud();
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function gameOver(){
    running = false;
    overlayMsg.textContent = 'Game over! Skor: ' + score + ' — klik Restart untuk cuba lagi.';
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // grid
    ctx.strokeStyle = colors.grid;
    for(let i=0;i<=GRID;i++){
      ctx.beginPath(); ctx.moveTo(i*cellSize,0); ctx.lineTo(i*cellSize,canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*cellSize); ctx.lineTo(canvas.width,i*cellSize); ctx.stroke();
    }
    // food
    ctx.fillStyle = colors.food;
    roundRect(food.x*cellSize+3, food.y*cellSize+3, cellSize-6, cellSize-6, 6);
    // snake
    snake.forEach((s,i)=>{
      if(i === 0 && headImgLoaded){
        // draw head image, rotated to face current direction
        const cx = s.x*cellSize + cellSize/2;
        const cy = s.y*cellSize + cellSize/2;
        let angle = 0;
        if(dir.x === 1) angle = 0;
        else if(dir.x === -1) angle = Math.PI;
        else if(dir.y === -1) angle = -Math.PI/2;
        else if(dir.y === 1) angle = Math.PI/2;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        ctx.drawImage(headImg, -cellSize/2, -cellSize/2, cellSize, cellSize);
        ctx.restore();
      } else if(i === 0){
        ctx.fillStyle = colors.snakeHead;
        roundRect(s.x*cellSize+2, s.y*cellSize+2, cellSize-4, cellSize-4, 5);
      } else {
        ctx.fillStyle = colors.snakeBody;
        roundRect(s.x*cellSize+2, s.y*cellSize+2, cellSize-4, cellSize-4, 5);
      }
    });
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
    ctx.fill();
  }

  function setDir(newDir){
    // prevent reversing directly into itself
    if(newDir.x === -dir.x && newDir.y === -dir.y) return;
    nextDir = newDir;
  }

  window.addEventListener('keydown', (e)=>{
    switch(e.key){
      case 'ArrowUp': e.preventDefault(); setDir({x:0,y:-1}); break;
      case 'ArrowDown': e.preventDefault(); setDir({x:0,y:1}); break;
      case 'ArrowLeft': e.preventDefault(); setDir({x:-1,y:0}); break;
      case 'ArrowRight': e.preventDefault(); setDir({x:1,y:0}); break;
    }
  });

  document.querySelectorAll('.dpad button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const map = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
      setDir(map[btn.dataset.dir]);
    });
  });

  restartBtn.addEventListener('click', ()=>{
    reset();
    draw();
  });

  function resizeCanvas(){
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.width; // square
    cellSize = canvas.width / GRID;
    draw();
  }
  window.addEventListener('resize', resizeCanvas);

  reset();
  setTimeout(()=>{ resizeCanvas(); }, 50);
  loopId = setInterval(tick, 130);
})();
</script>
</body>
</html>
